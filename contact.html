<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — NexusAI</title>
  <meta name="description" content="Get in touch with the NexusAI team.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19; --surface: #111827; --border: #243044;
      --text: #f1f5f9; --text-muted: #94a3b8;
      --primary: #6366f1; --primary-hover: #818cf8; --accent: #22d3ee; --success: #34d399;
      --radius: 12px; --max-width: 560px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: var(--primary-hover); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { position: sticky; top: 0; z-index: 100; background: rgba(11,15,25,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: var(--text); text-decoration: none; }
    .logo:hover { text-decoration: none; }
    .logo-mark { width: 28px; height: 28px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: white; }
    .nav a.back { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    .nav a.back:hover { color: var(--text); text-decoration: none; }
    main { max-width: var(--max-width); margin: 0 auto; padding: 64px 24px 96px; }
    h1 { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
    .lead { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 36px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    input, textarea, select {
      width: 100%; padding: 12px 14px; margin-bottom: 18px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { min-height: 120px; resize: vertical; }
    .btn { display: inline-flex; padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn:hover { background: var(--primary-hover); }
    .success { display: none; color: var(--success); font-weight: 500; margin-top: 16px; }
    .alt { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted); }
    footer { border-top: 1px solid var(--border); padding: 24px; text-align: center; font-size: 0.8125rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">N</span> NexusAI</a>
      <a href="index.html" class="back">← Back to home</a>
    </div>
  </nav>
  <main>
    <h1>Contact us</h1>
    <p class="lead">Sales, support, partnerships, or press — we'd love to hear from you.</p>

    <form id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required placeholder="Your name">

      <label for="email">Work email</label>
      <input type="email" id="email" name="email" required placeholder="you@company.com">

      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option>Sales / demo</option>
        <option>Support</option>
        <option>Partnerships</option>
        <option>Careers</option>
        <option>Press</option>
        <option>Other</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" required placeholder="How can we help?"></textarea>

      <button type="submit" class="btn">Send message</button>
      <p class="success" id="formSuccess">Thanks — we'll get back to you within one business day.</p>
    </form>

    <div class="alt">
      Or email us directly: <a href="mailto:hello@nexusai.example">hello@nexusai.example</a>
    </div>
  </main>
  <footer>© 2026 NexusAI Inc. · <a href="index.html">Home</a></footer>
  <script>
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      e.target.querySelector('button').style.display = 'none';
      document.getElementById('formSuccess').style.display = 'block';
    });
  </script>
</body>
</html>
